<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cardboard box, slightly open flaps -->
  <defs>
    <linearGradient id="boxBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6B37A"/>
      <stop offset="1" stop-color="#C88A4E"/>
    </linearGradient>
    <linearGradient id="boxLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C994"/>
      <stop offset="1" stop-color="#DDA766"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <rect x="12" y="24" width="40" height="30" rx="6" fill="url(#boxBody)" stroke="#A66C34" stroke-width="2.5"/>
  <!-- tape seam -->
  <rect x="29" y="24" width="6" height="30" fill="#B77C3F" opacity="0.5"/>
  <!-- left flap -->
  <path d="M12 26 Q10 16 20 16 L31 22 L12 26 Z" fill="url(#boxLid)" stroke="#A66C34" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- right flap -->
  <path d="M52 26 Q54 16 44 16 L33 22 L52 26 Z" fill="url(#boxLid)" stroke="#A66C34" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- highlight -->
  <rect x="16" y="28" width="12" height="4" rx="2" fill="#fff" opacity="0.45"/>
</svg>
