<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Corrugated cardboard cat scratcher pad, seen at a slight angle -->
  <defs>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0CE97"/>
      <stop offset="1" stop-color="#D2A263"/>
    </linearGradient>
    <linearGradient id="padSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C99555"/>
      <stop offset="1" stop-color="#A9793F"/>
    </linearGradient>
  </defs>
  <!-- front side / thickness -->
  <path d="M8 40 L56 40 L56 48 Q56 51 53 51 L11 51 Q8 51 8 48 Z" fill="url(#padSide)" stroke="#8C6330" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- top face -->
  <rect x="8" y="20" width="48" height="20" rx="5" fill="url(#pad)" stroke="#8C6330" stroke-width="2.5"/>
  <!-- corrugated ridges -->
  <g stroke="#B98A50" stroke-width="1.6" opacity="0.75">
    <line x1="14" y1="22" x2="14" y2="38"/>
    <line x1="19" y1="22" x2="19" y2="38"/>
    <line x1="24" y1="22" x2="24" y2="38"/>
    <line x1="29" y1="22" x2="29" y2="38"/>
    <line x1="34" y1="22" x2="34" y2="38"/>
    <line x1="39" y1="22" x2="39" y2="38"/>
    <line x1="44" y1="22" x2="44" y2="38"/>
    <line x1="49" y1="22" x2="49" y2="38"/>
  </g>
  <!-- claw scratch marks -->
  <g stroke="#8C6330" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="26" y1="24" x2="31" y2="35"/>
    <line x1="31" y1="24" x2="36" y2="35"/>
    <line x1="36" y1="24" x2="41" y2="35"/>
  </g>
  <!-- little toy on a string -->
  <path d="M52 20 Q56 12 52 8" fill="none" stroke="#B98A50" stroke-width="2" stroke-linecap="round"/>
  <circle cx="52" cy="7" r="4" fill="#F4A6C0" stroke="#D9749A" stroke-width="1.6"/>
  <circle cx="50.5" cy="5.5" r="1.2" fill="#fff" opacity="0.8"/>
  <!-- top highlight -->
  <rect x="12" y="22" width="14" height="3" rx="1.5" fill="#fff" opacity="0.4"/>
</svg>
