<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Paw Bomb: round bomb with a paw print and a lit fuse -->
  <defs>
    <radialGradient id="bombBody" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#6A6472"/>
      <stop offset="1" stop-color="#332F3B"/>
    </radialGradient>
  </defs>
  <!-- fuse -->
  <path d="M40 18 Q48 10 46 4" fill="none" stroke="#B98B4E" stroke-width="3" stroke-linecap="round"/>
  <!-- spark -->
  <g fill="#FFC24D">
    <circle cx="46" cy="4" r="4"/>
    <path d="M46 -3 L47.5 1 L51 -0.5 L48.5 3 L52 4 L48 5 L49 9 L46 6 L43 9 L44 5 L40 4 L44 3 L41.5 -0.5 L45 1 Z" fill="#FF8A3D"/>
  </g>
  <!-- bomb body -->
  <circle cx="30" cy="38" r="22" fill="url(#bombBody)" stroke="#211E29" stroke-width="2.5"/>
  <!-- highlight -->
  <ellipse cx="22" cy="30" rx="7" ry="5" fill="#fff" opacity="0.28"/>
  <!-- paw print -->
  <g fill="#F4A6C0">
    <ellipse cx="30" cy="41" rx="7" ry="6"/>
    <circle cx="21" cy="35" r="3"/>
    <circle cx="27" cy="31" r="3"/>
    <circle cx="33" cy="31" r="3"/>
    <circle cx="39" cy="35" r="3"/>
  </g>
</svg>
