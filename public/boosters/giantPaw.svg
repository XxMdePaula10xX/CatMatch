  <!-- main pad -->
  <path d="M32 60 C18 60 14 48 16 41 C18 35 26 34 32 34 C38 34 46 35 48 41 C50 48 46 60 32 60 Z" fill="url(#pawPad)" stroke="#D9648E" stroke-width="2.5"/>
