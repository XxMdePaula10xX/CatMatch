<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="body_black" cx="0.4" cy="0.32" r="0.85">
      <stop offset="0" stop-color="rgb(145,135,156)"/>
      <stop offset="0.6" stop-color="#63596E"/>
      <stop offset="1" stop-color="rgb(45,39,53)"/>
    </radialGradient>
    <linearGradient id="ear_black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(119,109,130)"/>
      <stop offset="1" stop-color="#3B3543"/>
