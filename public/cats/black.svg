  <path d="M17.5 24 C16.5 15 18.5 10.5 21 11 C24 12 27.5 17 28.5 21 C24.5 20.2 20.5 21.5 17.5 24 Z" fill="url(#innerEar_black)"/>
  <path d="M46.5 24 C47.5 15 45.5 10.5 43 11 C40 12 36.5 17 35.5 21 C39.5 20.2 43.5 21.5 46.5 24 Z" fill="url(#innerEar_black)"/>

