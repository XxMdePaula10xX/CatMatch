      <ellipse cx="40.6" cy="38.6" rx="2.5" ry="4" fill="#20161f"/>
      <path d="M35 33 Q40.6 29.4 46.2 33" fill="none" stroke="#0000001f" stroke-width="1.6" stroke-linecap="round"/>
