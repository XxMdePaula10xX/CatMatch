    <linearGradient id="innerEar_black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(224,151,181)"/>
      <stop offset="1" stop-color="#C77E9C"/>
    </linearGradient>
    <radialGradient id="eye_black" cx="0.42" cy="0.32" r="0.95">
           <stop offset="0" stop-color="rgb(195,255,142)"/>
           <stop offset="0.6" stop-color="#8CDC57"/>
           <stop offset="1" stop-color="rgb(90,170,37)"/>
         </radialGradient>
  </defs>

  <!-- ears -->
