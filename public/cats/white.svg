<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="body_white" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="rgb(255,255,255)"/>
      <stop offset="0.62" stop-color="#FDF5EA"/>
      <stop offset="1" stop-color="rgb(218,202,180)"/>
    </radialGradient>
    <radialGradient id="bodyB_white" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="rgb(255,255,255)"/>
      <stop offset="0.7" stop-color="#FDF5EA"/>
      <stop offset="1" stop-color="rgb(218,202,180)"/>
    </radialGradient>
    <linearGradient id="ear_white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(255,255,254)"/>
      <stop offset="1" stop-color="#E6D6C0"/>
    </linearGradient>
    <linearGradient id="innerEar_white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(255,208,229)"/>
      <stop offset="1" stop-color="#F7B7CC"/>
    </linearGradient>
    <radialGradient id="eye_white" cx="0.42" cy="0.3" r="0.95">
           <stop offset="0" stop-color="#5a4f63"/>
           <stop offset="0.55" stop-color="#332b3d"/>
           <stop offset="1" stop-color="#1e1826"/>
         </radialGradient>
  </defs>

  <!-- tail (outline then fill) -->
  <path d="M44 55 C 56 55.5 60.5 44.5 53 39.5" fill="none" stroke="#C6AB88" stroke-width="10" stroke-linecap="round"/>
  <path d="M44 55 C 56 55.5 60.5 44.5 53 39.5" fill="none" stroke="url(#bodyB_white)" stroke-width="6.4" stroke-linecap="round"/>

  <!-- body -->
  <path d="M32 33 C 45.5 33 49.5 43 49.5 50 C 49.5 58 42 61.6 32 61.6 C 22 61.6 14.5 58 14.5 50 C 14.5 43 18.5 33 32 33 Z" fill="url(#bodyB_white)" stroke="#C6AB88" stroke-width="2.3" stroke-linejoin="round"/>
  
  <!-- front paws -->
  <ellipse cx="25" cy="60.4" rx="4.6" ry="3.4" fill="url(#bodyB_white)" stroke="#C6AB88" stroke-width="2.3"/>
  <ellipse cx="39" cy="60.4" rx="4.6" ry="3.4" fill="url(#bodyB_white)" stroke="#C6AB88" stroke-width="2.3"/>
  <!-- body sheen -->
  <ellipse cx="26" cy="41" rx="7" ry="4" fill="#ffffff" opacity="0.18"/>

  <!-- ears -->
  <path d="M17 21 C 13.5 8 17 1.5 21.5 2.6 C 26.5 4 31 11 32 16 C 26.5 15 21 16.8 17 21 Z" fill="url(#ear_white)" stroke="#C6AB88" stroke-width="2.1" stroke-linejoin="round"/>
  <path d="M47 21 C 50.5 8 47 1.5 42.5 2.6 C 37.5 4 33 11 32 16 C 37.5 15 43 16.8 47 21 Z" fill="url(#ear_white)" stroke="#C6AB88" stroke-width="2.1" stroke-linejoin="round"/>
  <path d="M20.5 17.5 C 18.5 9.5 20.5 6 23 6.6 C 26 7.6 29 12.5 29.5 16 C 25.8 15.4 22.5 15.8 20.5 17.5 Z" fill="url(#innerEar_white)"/>
  <path d="M43.5 17.5 C 45.5 9.5 43.5 6 41 6.6 C 38 7.6 35 12.5 34.5 16 C 38.2 15.4 41.5 15.8 43.5 17.5 Z" fill="url(#innerEar_white)"/>

  <!-- head -->
  <circle cx="32" cy="23" r="18" fill="url(#body_white)" stroke="#C6AB88" stroke-width="2.3"/>
  
  
  <!-- sheen + rim light -->
  <ellipse cx="26" cy="14.5" rx="10" ry="6" fill="#ffffff" opacity="0.16"/>
  <path d="M17 16 C 20.5 10 26 7 31.5 7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>

  <!-- blush -->
  <ellipse cx="18.5" cy="29.5" rx="4" ry="2.6" fill="#FF7CAE" opacity="0.5"/>
  <ellipse cx="45.5" cy="29.5" rx="4" ry="2.6" fill="#FF7CAE" opacity="0.5"/>

  <!-- whiskers -->
  <g stroke="#C6AB88" stroke-width="1.2" stroke-linecap="round" opacity="0.42" fill="none">
    <path d="M17 26 Q11 25.5 6.5 24"/>
    <path d="M17 29 Q11 29.5 6 31"/>
    <path d="M47 26 Q53 25.5 57.5 24"/>
    <path d="M47 29 Q53 29.5 58 31"/>
  </g>

  <!-- eyes -->
  
    <g>
      <ellipse cx="25.2" cy="24.2" rx="4.9" ry="6.2" fill="url(#eye_white)"/>
      
      <path d="M20.6 20.2 Q25.2 17.2 29.799999999999997 20.2" fill="none" stroke="#0000001c" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="23.5" cy="21.4" rx="2.1" ry="2.7" fill="#ffffff"/>
      <circle cx="26.8" cy="26.6" r="1.25" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="23" cy="27.4" rx="0.9" ry="0.65" fill="#ffffff" opacity="0.5"/>
    </g>
  
    <g>
      <ellipse cx="38.8" cy="24.2" rx="4.9" ry="6.2" fill="url(#eye_white)"/>
      
      <path d="M34.199999999999996 20.2 Q38.8 17.2 43.4 20.2" fill="none" stroke="#0000001c" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="37.099999999999994" cy="21.4" rx="2.1" ry="2.7" fill="#ffffff"/>
      <circle cx="40.4" cy="26.6" r="1.25" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="36.599999999999994" cy="27.4" rx="0.9" ry="0.65" fill="#ffffff" opacity="0.5"/>
    </g>

  <!-- nose + mouth -->
  <path d="M29.4 27.6 Q32 26.9 34.6 27.6 Q33.2 30 32 30.9 Q30.8 30 29.4 27.6 Z" fill="#EF8288" stroke="#CB5F68" stroke-width="0.7" stroke-linejoin="round"/>
  <ellipse cx="30.9" cy="28.2" rx="0.8" ry="0.5" fill="#ffffff" opacity="0.6"/>
  <path d="M32 30.9 Q29.4 34 26.4 32.4" fill="none" stroke="#C6AB88" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M32 30.9 Q34.6 34 37.6 32.4" fill="none" stroke="#C6AB88" stroke-width="1.6" stroke-linecap="round"/>
</svg>