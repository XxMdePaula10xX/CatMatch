<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFF8E6"/>
      <stop offset="100%" stop-color="#FFE7B8"/>
    </radialGradient>
    <radialGradient id="fur" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFD9A8"/>
      <stop offset="60%" stop-color="#FFB36B"/>
      <stop offset="100%" stop-color="#F2933D"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- paw print accents -->
  <g fill="#FF6FAE" opacity="0.18">
    <circle cx="150" cy="170" r="34"/>
    <circle cx="880" cy="840" r="40"/>
  </g>
  <g fill="#42A5F5" opacity="0.15">
    <circle cx="870" cy="180" r="26"/>
    <circle cx="160" cy="860" r="30"/>
  </g>

  <!-- ears -->
  <path d="M300 300 L360 470 L210 440 Z" fill="url(#fur)" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  <path d="M724 300 L814 440 L664 470 Z" fill="url(#fur)" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  <path d="M300 320 L344 446 L250 426 Z" fill="#FF9CC8"/>
  <path d="M724 320 L774 426 L680 446 Z" fill="#FF9CC8"/>

  <!-- head -->
  <circle cx="512" cy="560" r="270" fill="url(#fur)" stroke="#fff" stroke-width="16"/>

  <!-- tabby stripes -->
  <g fill="#F2933D" opacity="0.55">
    <path d="M512 300 q-18 40 0 78 q18 -38 0 -78z"/>
    <path d="M430 320 q-6 40 14 70 q4 -40 -14 -70z"/>
    <path d="M594 320 q6 40 -14 70 q-4 -40 14 -70z"/>
  </g>

  <!-- eyes -->
  <ellipse cx="410" cy="540" rx="62" ry="74" fill="#fff"/>
  <ellipse cx="614" cy="540" rx="62" ry="74" fill="#fff"/>
  <circle cx="412" cy="552" r="40" fill="#5B4636"/>
  <circle cx="612" cy="552" r="40" fill="#5B4636"/>
  <circle cx="426" cy="538" r="14" fill="#fff"/>
  <circle cx="626" cy="538" r="14" fill="#fff"/>

  <!-- nose + mouth -->
  <path d="M488 612 h48 l-24 24 z" fill="#FF6FAE"/>
  <path d="M512 636 q-26 30 -56 14 M512 636 q26 30 56 14" fill="none" stroke="#6B3F24" stroke-width="10" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#6B3F24" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <path d="M300 600 h-90 M300 636 h-96 M724 600 h90 M724 636 h96"/>
  </g>

  <!-- yarn ball -->
  <g transform="translate(770,720)">
    <circle r="70" fill="#FF6FAE"/>
    <path d="M-50 -20 q50 -30 100 30 M-60 20 q60 -10 110 40 M-30 -55 q20 60 -20 110" fill="none" stroke="#E0508F" stroke-width="8"/>
  </g>
</svg>
