# Codemagic CI/CD — builds the iOS app on a cloud Mac (no local Mac needed)
# and uploads to App Store Connect / TestFlight.
#
# SETUP (one-time, in the Codemagic web UI):
# 1. Connect this GitHub repo.
# 2. App settings → Code signing identities → connect your Apple Developer
#    account via an App Store Connect API key (gives automatic signing).
# 3. Create an environment variable GROUP named "catmatch_env" containing your
#    Firebase web keys as variables (mark them as such):
#       VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#       VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID,
#       VITE_FIREBASE_APP_ID
# 4. Set BUNDLE_ID below to match the App ID you registered in App Store Connect.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-capacitor-app/

workflows:
  ios-release:
    name: Cat Match — iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CatMatch API Key # name of the key set in Codemagic
    environment:
      groups:
        - catmatch_env # Firebase VITE_* vars (see SETUP)
      vars:
        BUNDLE_ID: 'com.matheus.catmatch'
        XCODE_WORKSPACE: 'ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
        APP_STORE_APPLE_ID: 6782692948 # numeric App ID from App Store Connect
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Write .env from Codemagic vars
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF
      - name: Install dependencies
        script: npm ci
      - name: Build web + generate icons/splash
        script: |
          npm run build
          npx capacitor-assets generate --ios || true
      - name: Add & sync iOS platform
        script: |
          # Capacitor sets the bundle id from appId in capacitor.config.ts.
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up code signing (automatic, via App Store Connect API key)
        script: |
          set -e
          keychain initialize
          echo "==> Fetching signing files for $BUNDLE_ID"
          # CERTIFICATE_PRIVATE_KEY is a fixed RSA key stored as a Codemagic
          # secure env var, so the distribution certificate can be reused across
          # builds (CI keychains are ephemeral).
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create \
            --verbose
          keychain add-certificates
          echo "==> Provisioning profiles on disk:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          xcode-project use-profiles --verbose
      - name: Build IPA
        script: |
          echo "==> Signing-related build settings:"
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" \
            -showBuildSettings 2>/dev/null \
            | grep -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY" || true
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false  # flip to true when ready for review

  # Android is buildable without a Mac too (handy for quick public testing).
  android-release:
    name: Cat Match — Android
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      groups:
        - catmatch_env
      node: 20
    scripts:
      - name: Write .env from Codemagic vars
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF
      - name: Install dependencies
        script: npm ci
      - name: Build web + sync Android
        script: |
          npm run build
          npx capacitor-assets generate --android || true
          npx cap add android || true
          npx cap sync android
      - name: Build debug APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
