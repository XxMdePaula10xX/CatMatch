# Codemagic CI/CD — builds the iOS app on a cloud Mac (no local Mac needed)
# and uploads to App Store Connect / TestFlight.
#
# SETUP (one-time, in the Codemagic web UI):
# 1. Connect this GitHub repo.
# 2. App settings → Code signing identities → connect your Apple Developer
#    account via an App Store Connect API key (gives automatic signing).
# 3. Create an environment variable GROUP named "catmatch_env" containing your
#    Firebase web keys as variables (mark them as such):
#       VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#       VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID,
#       VITE_FIREBASE_APP_ID
# 4. Set BUNDLE_ID below to match the App ID you registered in App Store Connect.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-capacitor-app/

workflows:
  ios-release:
    name: Cat Match — iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CatMatch API Key # name of the key set in Codemagic
    environment:
      groups:
        - catmatch_env # Firebase VITE_* vars (see SETUP)
      vars:
        BUNDLE_ID: 'com.matheus.catmatch'
        XCODE_WORKSPACE: 'ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
        APP_STORE_APPLE_ID: 6782692948 # numeric App ID from App Store Connect
        APP_VERSION: '1.3' # marketing version (CFBundleShortVersionString)
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Write .env from Codemagic vars
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF
      - name: Install dependencies
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Add & sync iOS platform
        script: |
          # Capacitor sets the bundle id from appId in capacitor.config.ts.
          npx cap add ios || true
          npx cap sync ios
      - name: Generate app icon + splash
        script: |
          # Must run AFTER the iOS project exists so assets land in it.
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#FFF4DC' \
            --splashBackgroundColor '#FFF4DC' \
            --splashBackgroundColorDark '#2A2118'
      - name: Declare exempt encryption (skip export compliance prompt)
        script: |
          # App only uses standard HTTPS/TLS -> exempt. This removes the
          # "encryption documentation" prompt on every TestFlight upload.
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # Lock the game to portrait (iPhone).
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
      - name: Set version + incrementing build number
        script: |
          cd ios/App
          # The Capacitor template is NOT apple-generic versioned, so `agvtool
          # new-version` is unreliable. Set the Xcode build settings directly —
          # Info.plist resolves $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION)
          # at build time, so this is what actually ships.
          # Only treat a genuine "no builds yet" (empty output) as 0; abort on a
          # real API error so we never reset to build 1 and ship a duplicate.
          if LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID"); then
            LATEST=$(printf '%s' "$LATEST" | tr -d '[:space:]')
            [ -z "$LATEST" ] && LATEST=0
          else
            echo "ERROR: could not fetch latest build number (transient API error?). Aborting." >&2
            exit 1
          fi
          case "$LATEST" in ''|*[!0-9]*) echo "ERROR: non-numeric build number '$LATEST'." >&2; exit 1;; esac
          BUILD_NUMBER=$((LATEST + 1))
          echo "==> Version $APP_VERSION (build $BUILD_NUMBER)"
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${APP_VERSION};/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" App.xcodeproj/project.pbxproj
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Add privacy manifest (required-reason API declaration)
        script: |
          # The badge plugin uses UserDefaults (a required-reason API). Declare
          # it in an app-level PrivacyInfo.xcprivacy and add it to the App target.
          # Runs after pod install so CocoaPods can't drop the file reference.
          # (ios/ is regenerated each build, so this runs in CI.)
          cp scripts/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          ruby scripts/add_privacy_manifest.rb
      - name: Set up code signing (automatic, via App Store Connect API key)
        script: |
          set -e
          keychain initialize
          echo "==> Fetching signing files for $BUNDLE_ID"
          # CERTIFICATE_PRIVATE_KEY is a fixed RSA key stored as a Codemagic
          # secure env var, so the distribution certificate can be reused across
          # builds (CI keychains are ephemeral).
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create \
            --verbose
          keychain add-certificates
          echo "==> Provisioning profiles on disk:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          xcode-project use-profiles --verbose
      - name: Build IPA
        script: |
          echo "==> Signing-related build settings:"
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" \
            -showBuildSettings 2>/dev/null \
            | grep -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY" || true
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Just upload to App Store Connect. Internal TestFlight testing works
        # immediately (no beta review). To auto-submit to EXTERNAL TestFlight
        # later, set submit_to_testflight: true and configure a beta group.

  # Android is buildable without a Mac too (handy for quick public testing).
  android-release:
    name: Cat Match — Android
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      groups:
        - catmatch_env
      node: 20
    scripts:
      - name: Write .env from Codemagic vars
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF
      - name: Install dependencies
        script: npm ci
      - name: Build web + sync Android
        script: |
          npm run build
          npx cap add android
          npx capacitor-assets generate --android || true
          npx cap sync android
      - name: Build debug APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
