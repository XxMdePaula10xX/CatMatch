# Codemagic CI/CD — builds the iOS app on a cloud Mac (no local Mac needed)
# and uploads to App Store Connect / TestFlight.
#
# SETUP (one-time, in the Codemagic web UI):
# 1. Connect this GitHub repo.
# 2. App settings → Code signing identities → connect your Apple Developer
#    account via an App Store Connect API key (gives automatic signing).
# 3. Create an environment variable GROUP named "catmatch_env" containing your
#    Firebase web keys as variables (mark them as such):
#       VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#       VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID,
#       VITE_FIREBASE_APP_ID
# 4. Set BUNDLE_ID below to match the App ID you registered in App Store Connect.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-capacitor-app/

workflows:
  ios-release:
    name: Cat Match — iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CatMatch API Key # name of the key set in Codemagic
    environment:
      groups:
        - catmatch_env # Firebase VITE_* vars (see SETUP)
      vars:
        BUNDLE_ID: 'com.catmatch.app'
        XCODE_WORKSPACE: 'ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
        APP_STORE_APPLE_ID: 0000000000 # your numeric App ID from App Store Connect
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Write .env from Codemagic vars
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF
      - name: Install dependencies
        script: npm ci
      - name: Build web + generate icons/splash
        script: |
          npm run build
          npx capacitor-assets generate --ios || true
      - name: Add & sync iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Set bundle id
        script: |
          cd ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" App/Info.plist || true
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false  # flip to true when ready for review

  # Android is buildable without a Mac too (handy for quick public testing).
  android-release:
    name: Cat Match — Android
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      groups:
        - catmatch_env
      node: 20
    scripts:
      - name: Write .env from Codemagic vars
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF
      - name: Install dependencies
        script: npm ci
      - name: Build web + sync Android
        script: |
          npm run build
          npx capacitor-assets generate --android || true
          npx cap add android || true
          npx cap sync android
      - name: Build debug APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
